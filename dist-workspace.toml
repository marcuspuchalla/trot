# Release automation for `trot` — powered by dist (cargo-dist).
# Regenerate CI after editing:  dist generate
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
# Keep the explicit host quality gate: cargo-dist 0.32 permits skipped builds
# after a failed custom test job. See docs/releasing.md before regenerating CI.
allow-dirty = ["ci"]
# Codesign the macOS binaries with the Developer ID cert held in the
# CODESIGN_* secrets. dist signs but does NOT notarize (there is no notarytool
# anywhere in 0.32.0) — .github/workflows/notarize-macos.yml does that after the
# release publishes, which is the half that actually lifts Gatekeeper.
macos-sign = true
# Adds CODESIGN_OPTIONS=runtime to the build job — see the file for why.
github-build-setup = "../dist/build-setup.yml"
installers = ["shell", "powershell"]
# Gate artifact builds on the test suite. The explicit host condition in
# release.yml also gates publication (generated CI alone does not).
# It reuses .github/workflows/test.yml — the same gate a pull request runs, so a
# release can't be cut against code a PR would have rejected.
plan-jobs = ["./test"]
# Notarize after the release is announced. This has to be part of the pipeline:
# dist publishes as github-actions[bot], and GitHub never triggers a workflow
# from a GITHUB_TOKEN event, so `on: release` would never fire.
post-announce-jobs = ["./notarize-macos"]
# Ship the third-party (treadspan MIT) notice and the shell completions alongside
# the binary in every archive, so packagers can install completions to system
# paths. Everyone else can run `trot completions --install`.
include = ["THIRD-PARTY-NOTICES.md", "completions"]
targets = [
    "x86_64-apple-darwin",       # macOS Intel
    "aarch64-apple-darwin",      # macOS Apple Silicon
    "x86_64-pc-windows-msvc",    # Windows x64
    "x86_64-unknown-linux-gnu",  # Linux x64
    "aarch64-unknown-linux-gnu", # Linux arm64 — Raspberry Pi, ARM servers
]

# btleplug needs D-Bus headers + pkg-config to build on Linux; macOS and Windows
# need nothing. Scoped to the Linux targets rather than declared globally so the
# packages aren't requested on runners that have no use for them.
#
# Deliberately NO `version` key: writing `{ version = '*', targets = [...] }`
# generates `apt-get install libdbus-1-dev=*`, which is an invalid apt version
# pin and fails the build.
[dist.dependencies.apt]
libdbus-1-dev = { targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"] }
pkg-config = { targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"] }
