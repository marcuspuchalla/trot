[package]
name = "trot"
version = "0.5.0"
description = "The `trot` binary — TROT treadmill tracking CLI + daemon."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "trot"
path = "src/main.rs"

[dependencies]
trot-core = { path = "../trot-core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
directories = "5"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
# Loopback-only: the CLI talks to its own daemon on 127.0.0.1, so the default
# rustls + ring + webpki-roots stack is pure dead weight. Dropping defaults
# removes ~20 crates and the tree's only CDLA-licensed dependency.
ureq = { version = "2", default-features = false, features = ["json"] }
dialoguer = "0.11"
clap_complete = "4.6"

# getppid() for orphan detection — the daemon shuts down cleanly (disconnecting
# the treadmill) if its parent (Nowhere) dies without signalling it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
