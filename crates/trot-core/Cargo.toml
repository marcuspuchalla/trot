[package]
name = "trot-core"
version = "0.5.0"
description = "TROT tracking engine: device ingestion, sessions, storage, and the local HTTP/WS API."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
btleplug = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }
futures = "0.3"
anyhow = "1"
# Makes the Driver trait's async `run` dyn-dispatchable (native `async fn in
# trait` isn't object-safe), so the driver registry can be a plain static slice.
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
# v4 is load-bearing: engine.rs:50 generates the per-launch API token with it.
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[dev-dependencies]
# test-util gives tests a pausable clock, so supervisor/backoff tests don't
# actually sleep through their retry delays.
tokio = { version = "1", features = ["full", "test-util"] }
# Drive the axum Router directly in tests (ServiceExt::oneshot) so the API's
# security guard can be exercised without binding a real port.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
