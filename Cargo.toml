[workspace]
resolver = "2"
members = ["crates/trot-accounting", "crates/trot-core", "crates/trot-daemon"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Marcus Puchalla"]
rust-version = "1.85"
repository = "https://github.com/marcuspuchalla/trot"
homepage = "https://trot.puchalla.dev"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Profile dist uses for release-binary builds (thin LTO = faster CI, same size floor).
[profile.dist]
inherits = "release"
lto = "thin"
