name: Treadmill support
description: Trot can't find or read your treadmill.
labels: ["treadmill-support"]
body:
  - type: markdown
    attributes:
      value: |
        Hardware captures help us investigate models we do not own. Please use
        `trot diagnose --duration 90 --output trot-diagnostic.zip` and review the
        archive before attaching it. Raw BLE bytes and device names may identify
        your hardware; credentials and workout history are not included.
        See docs/diagnostics.md for details. This records data, never belt control.
  - type: input
    id: model
    attributes:
      label: Make and model
      placeholder: e.g. Horizon 7.0 AT
    validations:
      required: true
  - type: textarea
    id: scan
    attributes:
      label: Output of `trot scan --all`
      description: Run it with the treadmill powered on and nearby.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: ftms
    attributes:
      label: Does the console advertise FTMS?
      description: Look for an "FTMS" setting, or a "broadcast to Zwift / Kinomap" mode.
      options:
        - "Yes — it has an FTMS or Zwift/Kinomap mode"
        - "No"
        - "Don't know"
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: What happens when you try?
      description: Does it pair and report nothing, connect then drop, or never appear at all?
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic bundle and console observations
      description: Attach the reviewed ZIP, or share summary.txt first. Include Trot/Nowhere versions, console firmware if known, display units and observed speed/steps/time/distance. Do not post tokens or account credentials.
